# CI automático en push/PR: tipos, build y tests unitarios.
# B02 extiende este workflow con Supabase local para test:integration y RLS.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate -w @turnosmart/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run prisma:generate -w @turnosmart/backend
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
