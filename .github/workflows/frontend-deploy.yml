# A07: deploy manual del frontend. Nunca se dispara por push.
# Vercel Hobby sólo si A11 confirmó elegibilidad; si no, usar el target "azure" (Web App con output standalone).
# B es dueño de los workflows: este archivo se integra con el CD de B08.
name: Frontend deploy (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Destino del frontend
        type: choice
        options: [vercel, azure]
        required: true
      api_url:
        description: URL HTTPS de la API desplegada en la ventana (NEXT_PUBLIC_API_URL)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: ${{ inputs.api_url }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared

      - name: Deploy a Vercel
        if: inputs.target == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          url=$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Build standalone para Azure
        if: inputs.target == 'azure'
        run: |
          npm run build -w @turnosmart/frontend
          cd apps/frontend
          cp -r .next/static .next/standalone/apps/frontend/.next/static
          [ -d public ] && cp -r public .next/standalone/apps/frontend/public || true
          cd .next/standalone && zip -qr "$GITHUB_WORKSPACE/frontend.zip" .

      - name: Login Azure (OIDC)
        if: inputs.target == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy a Azure Web App
        if: inputs.target == 'azure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          package: frontend.zip
          startup-command: node apps/frontend/server.js

      - name: Smoke
        if: inputs.target == 'azure'
        run: |
          url="https://${{ vars.AZURE_FRONTEND_APP_NAME }}.azurewebsites.net/login"
          for i in $(seq 1 10); do curl -fsS -o /dev/null "$url" && exit 0; sleep 15; done
          echo "Smoke falló: $url" && exit 1
